# Security headers for every response (included by nginx.conf). nginx drops headers set at an
# outer level as soon as a location sets its own, so each such location includes this file.
#
# Content-Security-Policy: the page may only load its own scripts, its own data (/api), Google
# Fonts (App.css), and images from itself, data: and blob: (profile pictures, Excel downloads).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Don't let other sites show the app inside a frame (clickjacking)
add_header X-Frame-Options "DENY" always;
# Don't guess file types (a file is only run as the type the server says)
add_header X-Content-Type-Options "nosniff" always;
# Send only the site's address, not full page addresses, when following links elsewhere
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The app doesn't use the camera, microphone or location
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
