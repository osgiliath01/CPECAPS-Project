# Serves the built app and forwards /api/... to the backend container ("api").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV imports can be up to 5 MB
    client_max_body_size 10m;

    # Security headers (see security-headers.conf); don't show the nginx version
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # The API's interactive docs aren't public. Developers use them on the backend directly
    # (http://database.nyala-ordinal.ts.net:8000/docs, through Tailscale).
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Compress the voucher list and app files (about 10x smaller). Streams (live updates,
    # assistant replies) use other content types, so they are never held back for compression.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Look the backend up through Docker's DNS on every request, so restarting the backend
    # (which can change its address) doesn't break the app
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://api:8000;
    set $assistant http://assistant:8000;

    # The assistant has its own backend container, so heavy use of the rest of the app can't
    # starve it. Replies are streamed: pass them through immediately.
    location = /api/chat {
        rewrite ^/api/(.*)$ /$1 break;          # /api/chat -> /chat
        proxy_pass $assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;          # /api/projects -> /projects
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Live updates and the assistant stream their replies: pass them through immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Build files have unique names, so browsers may keep them
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Always check for a new version of these
    location = /version.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
