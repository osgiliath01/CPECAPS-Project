# Serves the built app and forwards /api/... to the backend container ("api").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV imports can be up to 5 MB
    client_max_body_size 10m;

    # Look the backend up through Docker's DNS on every request, so restarting the backend
    # (which can change its address) doesn't break the app
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;          # /api/projects -> /projects
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Live updates and the assistant stream their replies: pass them through immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Build files have unique names, so browsers may keep them
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always check for a new version of these
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
