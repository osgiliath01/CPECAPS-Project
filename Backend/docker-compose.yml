services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: caic123
      POSTGRES_DB: caic_db
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The one shared backend. Everyone's frontend points here instead of running their own.
  api:
    build: .
    container_name: caic-api
    restart: unless-stopped
    environment:
      # "db" is the database container above; the backend reaches it inside Docker
      DATABASE_URL: postgresql+psycopg://postgres:caic123@db:5432/caic_db
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: