# Settings shared by the two backend containers (api and assistant)
x-backend-env: &backend-env
  # Signs sign-in tokens. Kept in Backend/.env (not committed); see .env.example
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in Backend/.env (copy Backend/.env.example)}
  # "db" is the database container below; the backend reaches it inside Docker
  DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}@db:5432/caic_db
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  # One signed-in device per account (sessions.py). Exempt usernames may sign in many times
  SINGLE_SESSION: ${SINGLE_SESSION:-true}
  # Minutes without activity before a sign-in expires (renewed while the person is active)
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SINGLE_SESSION_EXEMPT: ${SINGLE_SESSION_EXEMPT:-}
  # Websites other than the app itself that may call the API (developers' npm run dev)
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  # Limits on sign-ups and forgot-password requests (README 4.20)
  REGISTER_PER_IP_PER_HOUR: ${REGISTER_PER_IP_PER_HOUR:-10}
  REGISTER_TOTAL_PER_HOUR: ${REGISTER_TOTAL_PER_HOUR:-30}
  MAX_WAITING_ACCOUNTS: ${MAX_WAITING_ACCOUNTS:-50}
  RESET_PER_IP_PER_HOUR: ${RESET_PER_IP_PER_HOUR:-10}
  RESET_TOTAL_PER_HOUR: ${RESET_TOTAL_PER_HOUR:-60}
  # The assistant's model server and model (see the ollama service below and chatbot.py)
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_MODEL: qwen3:4b-instruct-2507-q4_K_M
  # This instruct model answers directly; Ollama labels it "thinking" only because of its template
  OLLAMA_THINK: "false"

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    # Room for every backend process's connection pool plus developers (default is 100)
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      # Only used when the database is first created. To change it later, see README (Secrets)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
      POSTGRES_DB: caic_db
    ports:
      # Only this computer (and Tailscale, which forwards database.nyala-ordinal.ts.net:5432 to it)
      # can reach the database; other devices on the same network can't. DB_BIND=0.0.0.0 opens it.
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The one shared backend. Everyone's frontend points here instead of running their own.
  api:
    build: .
    container_name: caic-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_WORKERS: 4          # processes, to use 4 CPU cores (one process maxed out at ~500 users)
      DB_POOL_SIZE: 10        # per process: 4 x (10 + 10) = up to 80 connections
      DB_MAX_OVERFLOW: 10
    ports:
      # For developers through Tailscale (database.nyala-ordinal.ts.net:8000). Everyone else uses
      # the app on port 80, which passes /api/... on. API_BIND=0.0.0.0 opens it to the network.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # The assistant (/chat) on its own backend process, so heavy use of the rest of the app can't
  # starve it (at 500 users it froze when it shared the api process). Same code as api; nginx
  # sends /api/chat here. Not published: only the web container reaches it.
  assistant:
    build: .
    container_name: caic-assistant
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_WORKERS: 1
      DB_POOL_SIZE: 5         # its lookups are small: up to 10 connections
      DB_MAX_OVERFLOW: 5
    depends_on:
      db:
        condition: service_healthy

  # The app itself: built React files served by nginx, with /api/... passed to the backend.
  # Everyone opens http://<server>/ in a browser; nobody needs the code or npm.
  web:
    build:
      context: ../Frontend
      args:
        # Version stamp, set by deploy.ps1; "dev" when built by hand
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-dev}
        APP_BRANCH: ${APP_BRANCH:-local}
        APP_BUILT: ${APP_BUILT:-}
    container_name: caic-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - api
      - assistant

  # Local AI model server for the chatbot. Private: no published port, so only the
  # backend containers can reach it (at http://ollama:11434). Download a model once with:
  #   docker compose exec ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
  # Nightly encrypted backups of the database (Backend/backup/backup.sh). Writes to the backups
  # folder (BACKUP_DIR; deploy.ps1 uses .\backups next to it by default), which Google Drive for
  # desktop syncs. Run by hand with .\backup.ps1; restore with .\restore.ps1.
  backup:
    build: ./backup
    container_name: caic-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
      PGDATABASE: caic_db
      # Encrypts every backup. Without it the backups can't be opened: keep a copy somewhere safe
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?Set BACKUP_PASSPHRASE in Backend/.env}
      TZ: Asia/Manila
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR (deploy.ps1 sets it to the backups folder)}
        target: /backups
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: caic-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m      # keep the model loaded for 30 minutes after the last question
      OLLAMA_NUM_PARALLEL: 1      # one answer at a time keeps memory use low
      # Use less graphics memory, so more of the model fits on a 4 GB GPU
      OLLAMA_FLASH_ATTENTION: 1   # more memory-efficient attention
      OLLAMA_KV_CACHE_TYPE: q8_0  # conversation memory at half size, with negligible quality loss
    volumes:
      - ollama_models:/root/.ollama   # downloaded models survive restarts and updates
    deploy:
      resources:
        limits:
          memory: 6g              # so a large answer can't starve the database (4b needs ~5 GB)
        # Use the NVIDIA GPU (RTX 3050). Needs a current NVIDIA driver and Docker Desktop on WSL 2.
        # On a computer without an NVIDIA GPU, delete these 5 lines or the container won't start.
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  ollama_models:
